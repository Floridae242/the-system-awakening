services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: awakening
      POSTGRES_USER: awakening
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - awakening-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awakening -d awakening"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:?set URL-encoded DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      VERIFICATION_SERVICE_TOKEN: ${VERIFICATION_SERVICE_TOKEN:?set VERIFICATION_SERVICE_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:?set URL-encoded DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      VERIFICATION_SERVICE_TOKEN: ${VERIFICATION_SERVICE_TOKEN:?set VERIFICATION_SERVICE_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AWAKENING_API_INTERNAL_URL: ${AWAKENING_API_INTERNAL_URL:-http://api:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  awakening-prod-postgres:
