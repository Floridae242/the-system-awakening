name: Awakening CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: awakening
          POSTGRES_PASSWORD: awakening-ci
          POSTGRES_DB: awakening
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U awakening -d awakening"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./ci-awakening.db
      JWT_SECRET: ci-only-secret-that-is-long-enough
      VERIFICATION_SERVICE_TOKEN: ci-only-verifier-token-that-is-long-enough
      DEMO_MODE: "true"
      E2E_EXTERNAL: "1"
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv apps/api/.venv && apps/api/.venv/bin/pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: API migrations and tests (80% coverage gate)
        run: DATABASE_URL=postgresql+asyncpg://awakening:awakening-ci@127.0.0.1:5432/awakening apps/api/.venv/bin/alembic upgrade head && npm run test:api
      - name: PostgreSQL concurrency
        run: TEST_POSTGRES_URL=postgresql+asyncpg://awakening:awakening-ci@127.0.0.1:5432/awakening bash scripts/run-postgres-concurrency.sh
      - name: Build
        run: npm run build
      - name: Start API and web for E2E
        run: |
          (apps/api/.venv/bin/uvicorn main:app --app-dir apps/api --host 127.0.0.1 --port 8000 > /tmp/awakening-api.log 2>&1 &)
          (npm run start --workspace @tsa/web -- --hostname 127.0.0.1 --port 3000 > /tmp/awakening-web.log 2>&1 &)
          for i in {1..60}; do curl -fsS http://127.0.0.1:8000/api/v1/health && curl -fsS http://127.0.0.1:3000 && break || sleep 2; done
      - name: E2E
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Security scan
        run: |
          npm audit --audit-level=high
          python -m pip check
          ! git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36})' -- ':!package-lock.json'
