services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: awakening
      POSTGRES_USER: awakening
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-awakening-only}
    ports:
      - "5433:5432"
    volumes:
      - awakening-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awakening -d awakening"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  awakening-postgres:
